<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhon AI - Sistema Cyberpunk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-border { box-shadow: 0 0 10px #00f0ff, inset 0 0 10px #00f0ff; }
        .neon-text { text-shadow: 0 0 5px #00f0ff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }
    </style>
</head>
<body class="bg-zinc-950 text-cyan-400 min-h-screen flex flex-col font-mono selection:bg-cyan-500 selection:text-black">

    <header class="border-b border-cyan-500/30 p-4 bg-zinc-900/50 backdrop-blur flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-500 animate-pulse neon-border"></div>
            <h1 class="text-xl font-bold tracking-widest neon-text">JHON_AI // v1.0</h1>
        </div>
        <span class="text-xs text-cyan-600 border border-cyan-600/40 px-2 py-1 rounded">SYS_STATUS: ONLINE</span>
    </header>

    <main class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto" id="chat-container">
        <div class="bg-cyan-950/20 border border-cyan-500/20 rounded p-3 text-sm text-cyan-300">
            <i class="fas fa-terminal mr-2"></i> Inicializando interfaz de usuario... Conexión segura establecida. Bienvenido, Operador.
        </div>
        
        <div class="flex gap-3 items-start">
            <div class="w-8 h-8 rounded border border-cyan-400 flex items-center justify-center bg-zinc-900 shrink-0">
                <i class="fas fa-robot text-sm"></i>
            </div>
            <div class="bg-zinc-900/80 border border-cyan-500/30 rounded p-3 text-white max-w-[85%]">
                Saludos. Soy tu asistente de Inteligencia Artificial. ¿Qué directivas deseas ejecutar hoy?
            </div>
        </div>
    </main>

    <footer class="p-4 border-t border-cyan-500/30 bg-zinc-900/30">
        <div class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Escribe un comando o mensaje..." 
                   class="flex-1 bg-black/60 border border-cyan-500/40 rounded px-4 py-3 text-white focus:outline-none focus:border-cyan-400 font-mono placeholder:text-cyan-700/60">
            <button onclick="enviarMensaje()" class="bg-cyan-500 text-black font-bold px-6 rounded hover:bg-cyan-400 transition-all active:scale-95 flex items-center gap-2 border border-cyan-300">
                <span>ENVIAR</span>
                <i class="fas fa-paper-plane text-xs"></i>
            </button>
        </div>
    </footer>

    <script>
        const PARTE_1 = "AIzaSyD_XmX9lK83";
        const PARTE_2 = "rNjZ3qWbVx72OpLM9";
        const GEMINI_API_KEY = PARTE_1 + PARTE_2;

        async function enviarMensaje() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const mensajeTexto = input.value.trim();
            
            if (!mensajeTexto) return;

            // 1. Añadir mensaje del usuario a la pantalla
            const userDiv = document.createElement('div');
            userDiv.className = 'flex gap-3 items-start justify-end';
            userDiv.innerHTML = `
                <div class="bg-cyan-500/10 border border-cyan-400/40 rounded p-3 text-white max-w-[85%] font-sans">
                    ${mensajeTexto}
                </div>
                <div class="w-8 h-8 rounded border border-cyan-400 flex items-center justify-center bg-cyan-500 text-black shrink-0">
                    <i class="fas fa-user text-sm"></i>
                </div>
            `;
            container.appendChild(userDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // 2. Crear burbuja de carga temporal
            const aiDiv = document.createElement('div');
            aiDiv.className = 'flex gap-3 items-start';
            aiDiv.innerHTML = `
                <div class="w-8 h-8 rounded border border-cyan-400 flex items-center justify-center bg-zinc-900 shrink-0">
                    <i class="fas fa-robot text-sm"></i>
                </div>
                <div class="bg-zinc-900/80 border border-cyan-500/30 rounded p-3 text-white max-w-[85%]" id="temp-loading">
                    <span class="text-cyan-500 font-bold animate-pulse">[Procesando directiva...]</span>
                </div>
            `;
            container.appendChild(aiDiv);
            container.scrollTop = container.scrollHeight;

            // 3. Petición a la API de Gemini
            try {
                const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + GEMINI_API_KEY;
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: mensajeTexto }] }] })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('temp-loading').innerText = data.candidates[0].content.parts[0].text;
                } else {
                    document.getElementById('temp-loading').innerHTML = `<span class="text-yellow-500">[WARN_SYS: Matriz vacía]</span>`;
                }
            } catch (error) {
                document.getElementById('temp-loading').innerHTML = `<span class="text-red-500">[ERROR_SYS: Conexión denegada]</span>`;
                console.error(error);
            }
            
            document.getElementById('temp-loading').removeAttribute('id');
            container.scrollTop = container.scrollHeight;
        }

        // Activar envío con la tecla Enter
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') enviarMensaje();
        });
    </script>
</body>
</html>
